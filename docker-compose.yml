version: "3.9"

services:
  app:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "pip install -r requirements.txt && uvicorn app.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_PORT: 8000
